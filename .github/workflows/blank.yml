name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Path adjust karein (e.g., ./android) agar project subfolder me hai
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # working-directory: ./your-subfolder-name  # Un-comment aur update karein agar zarurat ho

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        # working-directory: ./your-subfolder-name  # Un-comment aur update karein agar zarurat ho

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Debug-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          retention-days: 7
          
